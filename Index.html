ki<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #00e6e6;
      margin-bottom: 30px;
    }
    button {
      background: #00e6e6;
      border: none;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      color: #001a1a;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover {
      background: #00b3b3;
    }
    audio {
      width: 90%;
      max-width: 400px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>🎧 My Music Player</h1>

  <audio id="player" controls></audio>
  <br>
  <button onclick="prevSong()">⏮️ Previous</button>
  <button onclick="nextSong()">Next ▶️</button>

  <script>
    // Add your songs here
    const songs = [
      "song1.mp3",
      "song2.mp3",
      "song3.mp3"
      "#"
    "#"
    "#"
      
    ];

    let currentSong = 0;
    const player = document.getElementById("player");

    // Load first song
    player.src = songs[currentSong];

    // Auto next when song ends
    player.addEventListener("ended", nextSong);

    // Function: Play next song
    function nextSong() {
      currentSong++;
      if (currentSong >= songs.length) {
        currentSong = 0; // Loop back to first
      }
      player.src = songs[currentSong];
      player.play();
    }

    // Function: Play previous song
    function prevSong() {
      currentSong--;
      if (currentSong < 0) {
        currentSong = songs.length - 1; // Go to last song
      }
      player.src = songs[currentSong];
      player.play();
    }
  </script>

</body>
</html>
